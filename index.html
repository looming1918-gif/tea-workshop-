<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>茶工坊</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="site-shell">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换为白色界面" aria-pressed="false">
      <span class="theme-swatch theme-swatch-dark" aria-hidden="true"></span>
      <span class="theme-swatch theme-swatch-light" aria-hidden="true"></span>
    </button>

    <section class="menu" id="menu" aria-labelledby="menu-title">
      <h1 id="menu-title">选择作品</h1>
      <div class="bridge-scene" aria-label="在桥的两端选择作品">
        <div class="bridge-drawing" aria-hidden="true">
          <span class="bridge-arch"></span>
          <span class="hanger hanger-one"></span>
          <span class="hanger hanger-two"></span>
          <span class="hanger hanger-three"></span>
          <span class="hanger hanger-four"></span>
          <span class="hanger hanger-five"></span>
          <span class="bridge-base"></span>
          <span class="time-label">时间</span>
        </div>

        <button class="choice choice-left" type="button" data-work="five" aria-label="打开：我在桥上看风景，只问去处">
          <span class="choice-node" aria-hidden="true"></span>
          <span class="choice-name">我在桥上看风景，只问去处</span>
        </button>
        <button class="choice choice-right" type="button" data-work="breathe" aria-label="打开：我在桥上看风景，不问时间">
          <span class="choice-node" aria-hidden="true"></span>
          <span class="choice-name">我在桥上看风景，不问时间</span>
        </button>
      </div>
    </section>

    <section class="player" id="player" aria-live="polite" hidden>
      <button class="back-button" id="backButton" type="button" aria-label="退出作品，返回选择页">
        <span aria-hidden="true">&#8592;</span>
      </button>
      <video id="fiveVideo" class="artwork-video" muted playsinline preload="metadata">
        <source src="assets/five-rings.mp4" type="video/mp4">
      </video>
      <video id="breatheVideo" class="artwork-video" muted playsinline preload="metadata">
        <source src="assets/breathing-dots.mp4" type="video/mp4">
      </video>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
