<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="茶工坊">
  <title>茶工坊</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="site-shell">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换为白色界面" aria-pressed="false">
      <span class="theme-swatch theme-swatch-dark" aria-hidden="true"></span>
      <span class="theme-swatch theme-swatch-light" aria-hidden="true"></span>
    </button>

    <button class="offline-button" id="offlineButton" type="button" aria-label="下载网站供离线使用" hidden>
      <span class="offline-icon" aria-hidden="true">&#8595;</span>
      <span id="offlineLabel">离线下载</span>
    </button>

    <button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="进入全屏" aria-pressed="false">
      <span class="fullscreen-icon" aria-hidden="true">&#x26F6;</span>
    </button>

    <section class="menu" id="menu" aria-labelledby="menu-title">
      <h1 id="menu-title">On the bridge, watching the view</h1>
      <div class="bridge-scene" aria-label="在桥的两端选择作品">
        <div class="bridge-drawing" aria-hidden="true">
          <span class="bridge-arch"></span>
          <span class="hanger hanger-one"></span>
          <span class="hanger hanger-two"></span>
          <span class="hanger hanger-three"></span>
          <span class="hanger hanger-four"></span>
          <span class="hanger hanger-five"></span>
          <span class="bridge-base"></span>
        </div>

        <button class="choice choice-left" type="button" data-work="five" aria-label="Open: heart set on where I’m bound">
          <span class="choice-node" aria-hidden="true"></span>
          <span class="choice-name">
            <span class="choice-line">heart set on where I’m bound</span>
          </span>
        </button>
        <button class="choice choice-right" type="button" data-work="breathe" aria-label="Open: at peace, watching time flow">
          <span class="choice-node" aria-hidden="true"></span>
          <span class="choice-name">
            <span class="choice-line">at peace, watching time flow</span>
          </span>
        </button>
      </div>
    </section>

    <section class="player" id="player" aria-live="polite" hidden>
      <button class="back-button" id="backButton" type="button" aria-label="退出作品，返回选择页">
        <span aria-hidden="true">&#8592;</span>
      </button>
      <video id="fiveVideo" class="artwork-video" muted playsinline preload="metadata">
        <source src="assets/five-rings.mp4" type="video/mp4">
      </video>
      <video id="breatheVideo" class="artwork-video" muted playsinline preload="metadata">
        <source src="assets/breathing-dots.mp4" type="video/mp4">
      </video>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
